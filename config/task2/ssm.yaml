# Task 2 - SSM NWP config
seed: 42

data:
  plain_file: data/plain.txt
  train_split: 0.8
  max_len: 128

model:
  vocab_size: 10000
  d_model: 256
  d_state: 256
  dropout: 0.3

training:
  epochs: 10
  batch_size: 64
  lr: 0.001

logging:
  use_wandb: true
  project: dominion-ssm-nwp

output:
  dir: outputs/task2_ssm
  repo_id: Krishiv03/predict-NWP-MLM-cipher-model
